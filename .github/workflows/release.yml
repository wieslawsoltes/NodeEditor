name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Install workloads
      run: dotnet workload install wasm-tools
    - name: Build
      run: dotnet build -c Release

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Install workloads
      run: dotnet workload install wasm-tools
    - name: Test
      run: dotnet test -c Release

  pack:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Validate release tag
      if: github.ref_type == 'tag'
      run: |
        version=$(dotnet msbuild src/NodeEditorAvalonia/NodeEditorAvalonia.csproj -nologo -getProperty:PackageVersion)
        if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
          printf '::error::Release tag %s must match package version v%s.\n' "$GITHUB_REF_NAME" "$version"
          exit 1
        fi
    - name: Install workloads
      run: dotnet workload install wasm-tools
    - name: Pack
      run: dotnet pack -c Release -o artifacts/nuget
    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/nuget/*.nupkg
        if-no-files-found: error

  artifacts:
    runs-on: ubuntu-latest
    needs: pack
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: release
    - name: Create release bundle
      run: |
        mkdir -p bundle
        zip -j bundle/nodeeditor-packages.zip release/*.nupkg
    - name: Upload release bundle
      uses: actions/upload-artifact@v4
      with:
        name: release-bundle
        path: bundle/nodeeditor-packages.zip

  nuget_push:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: artifacts
    environment: nuget.org
    permissions:
      id-token: write
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: nuget
    - name: Log in to NuGet with OIDC
      id: nuget_login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ vars.NUGET_USER }}
    - name: Push packages to NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push 'nuget/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  github_release:
    runs-on: ubuntu-latest
    needs: nuget_push
    permissions:
      contents: write
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: release
    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          release/*.nupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
